/* motor genérico para listas: grupos de filtros (E dentro de grupos diferentes, OU dentro do mesmo grupo) */
function motor(d,t,its){const G={};d.f.forEach(f=>(G[f.g]=G[f.g]||[]).push(f));
 const M={},U={};let any=false;
 Object.keys(G).forEach(g=>{const m=G[g].filter(f=>f.rx.test(t));if(m.length){M[g]=m;any=true}else{const df=G[g].find(f=>f.def);if(df)U[g]=[df]}});
 const lista=LISTA.test(t);
 if(!any){return d.resumo(its,t)}
 const multi=Object.keys(M).find(g=>M[g].length>1);
 const apply=(base,skip)=>{let R=base;Object.keys(M).concat(Object.keys(U)).forEach(g=>{if(g===skip)return;const fs=M[g]||U[g];R=R.filter(i=>fs.some(f=>f.p(i)))});return R};
 const txt=(R,fs)=>{const n=R.length;if(!n)return `${d.z} ${d.s} ${fs.map(f=>f.a[0]).join(', ')}.`;const vf=fs.find(f=>f.v),vv=vf?r2(R.reduce((s,i)=>s+(vf.v(i)||0),0)):0;
  return `${n} ${plur(n,d)} ${fs.map(f=>f.a[n==1?0:1]).join(', ')}${vf&&vv?', somando '+brl(vv):''}${(lista||n<=3)?': '+nomes(R.map(i=>i.n),lista?12:3):''}.`};
 const fixo=g=>M[g]||U[g]||[];const todos=Object.keys(M).concat(Object.keys(U)).filter(g=>g!==multi).flatMap(g=>M[g]||U[g]);
 if(multi){const R0=apply(its,multi),partes=M[multi].map(f=>txt(R0.filter(f.p),[...todos,f])),uni=R0.filter(i=>M[multi].some(f=>f.p(i)));
  return partes.join(' ')+(uni.length!==R0.filter(M[multi][0].p).length||M[multi].length>1?` Juntas: ${uni.length}${(()=>{const vf=todos.concat(M[multi]).find(f=>f.v);return vf?', somando '+brl(r2(uni.reduce((s,i)=>s+(vf.v(i)||0),0))):''})()}.`:'')}
 const R=apply(its);return txt(R,Object.keys(M).concat(Object.keys(U)).flatMap(g=>M[g]||U[g]))}

/* ===== roteamento das consultas ===== */
const DOMS=[
 [/o que (falta|tenho|preciso|devo)|pendencias do app|alertas|avisos|resumo geral|tudo que falta/,()=>dAlertas],
 [/\bmeta\b|campanhas?|conversas|orcamento diario/,()=>dMeta],

 [/saldo|cartao|fatura|fixos?|variave|disponivel|despesas?|\bgast(o|os|ei)\b|\bsaidas?\b|\bsaiu\b|\bpaguei\b|\bcompr(ei|as?)\b|imposto|faturamento|limites?|receita|custo (por|do) dia|lancamentos?|anuncios?|lucro.*\bmes\b|\bmes\b.*lucro|lucro mensal|aluguel/,()=>dFin],
 [/entrou|entrada|caixa|lucro|custos?|vendas?|vendi|baixas?|recebi|ganhei|faturei|cinquenta|\b50\b|devolvid|expirad/,()=>dVendas],
 [/clientes?|ativos?|pausad|pendent|vence|vencim|atrasad|renov|retorn|\bnovos?\b|\bplano\b|\bgold\b|\bmega\b|\bplus\b|smart|advanced|contat|chamei|falei|celular|a renovar|faltam|previsao|vou receber|a receber/,()=>dCli]];
const invNome=t=>(S.inv||[]).some(x=>x.n.trim().length>1&&new RegExp('\\b'+nz(x.n).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b').test(t));
async function consulta(t){
 if(/relatorio|resum(o|ir)|como foi (o )?dia|balanco do dia/.test(t)&&!/geral/.test(t))return await RELAT();
 if(invNome(t))return await dInv(t);
 if(nmFixo(t).length||nmCat(t).length)return await dFin(t);
 for(const [rx,f] of DOMS)if(rx.test(t))return await f()(t);
 return null}

const lst=m=>()=>{modo=m;$('#q').value='';tela('v1');lista()};
const NAV=[
 [/vencem hoje|vence hoje|faltam/,'os clientes que vencem hoje',lst('HOJE')],
 [/pendentes/,'os pendentes',lst('PENDENTES')],
 [/\b(ativos|todos os clientes|lista de clientes)\b/,'a lista de clientes ativos',lst('ATIVOS')],
 [/operacional|painel/,'a gestão operacional',()=>oper()],
 [/financa pessoal|financas pessoais|minha financa/,'a finança pessoal',()=>fp()],
 [/gestao financeira|financeiro|financeira/,'a gestão financeira',()=>fin()],
 [/investimentos?/,'os investimentos',()=>inv()],
 [/vencimentos/,'os vencimentos',()=>venc()],
 [/historico/,'o histórico diário',()=>histD()],
 [/previsao/,'a previsão da semana',()=>prev()],
 [/simulador/,'o simulador',()=>simu()],
 [/retencao/,'a retenção',()=>ret()],
 [/notas fiscais|notas a emitir|emitir notas|\bnfs?\b/,'as notas a emitir',()=>nfs()],
 [/notificac/,'a central de notificações',()=>nt()],
 [/cinquenta vencidos|50 vencidos/,'os R$ 50 vencidos',()=>e50v()],
 [/\bamr\b|contabilidade/,'a AMR',()=>amr()],
 [/anuncios?|\bmeta\b/,'os anúncios Meta',()=>mtMain()],

 [/limites?/,'os limites',()=>lim()],

];
const AJUDA='Posso responder qualquer dado do app, sozinho ou combinado. Exemplos: quantas notas fiscais; notas completas prontas para emissão; quantos pendentes do plano gold; quem vence amanhã; quanto entrou ontem; lucro da semana; saldo da empresa; fixos a pagar; quanto gastei no mercado; investimento total; proventos; gasto da Meta; o que falta fazer.\nAbrir telas: pendentes, financeira, notas fiscais, lançamentos, menu.\nFazer: dar baixa no Bazar; pausar Barbeiro; renovar Cabelo plano gold; lançar 25 reais de mercado pessoal; fechar o dia; atualizar.\nPara cliente com código, diga o nome e os números.\nDiga mais rápido ou mais devagar para ajustar a voz.';

/* ---------- ações ---------- */
const info=c=>{const p=pend(c);return `${c.cliente.trim()}: plano ${c.plano||'sem plano'}, vence em ${String(c.fim||'').slice(0,5)||'sem data'}, ${ok(c)?'ativo':'pausado'}${p?`, pendência de ${c.pg} com pagamento em ${String(c.datapg).slice(0,5)}`:''}, ${S.cont[c.cliente]||0} renovações.`};
function acBaixa(t){const pool=ativos().filter(pend);
 if(needCli(t,pool,c=>ask(`Dar baixa em ${c.cliente.trim()}, ${c.pg}?`,async()=>{const i=C.indexOf(c),v=c.pg;ficha(i);$('#pe').checked=false;const m=await withAlert(()=>voltarF(i));return m.length?m.join(' '):`Baixa registrada em ${c.cliente.trim()}, ${v}.`}),null))return true;
 const r=achaCli(t,C);fail=r.length?`${r[0].c.cliente.trim()} não está com pagamento pendente.`:'Não achei esse cliente entre os pendentes. Diga o nome e os números.';return false}
function acPausar(t){return needCli(t,ativos(),c=>ask(`Pausar ${c.cliente.trim()}?`,async()=>{const r=await pausaCli(c);await save();tela('v1');lista();return r?`${c.cliente.trim()} pausado.`:`${c.cliente.trim()} pausado no app. O envio para a planilha ficou na fila.`}),'Não achei esse cliente entre os ativos. Diga o nome e os números.')}
function acRenovar(t,c){
 const pl=planOf(t)||planOf(nz(c.plano));
 if(!pl){btns=[['❌ Cancelar',cancelar]];ans=async T=>{for(const x of T)if(planOf(x)){ans=null;btns=[];acRenovar(x+' '+t,c);return true}return false};say(`Qual plano para ${c.cliente.trim()}? Gold, Mega ou Plus, e se é Smart ou Advanced.`,listen);return}
 const tt=w2n(t),dm=tt.match(/desconto(?: de)? (\d+(?:\.\d+)?)/),ds=dm?+dm[1]:0,pe=/\b(pendente|pendencia|depois|a prazo|fiado|vai pagar)\b/.test(t),ini=/anteontem/.test(t)?-2:/\bontem\b/.test(t)?-1:0;
 let dv=null;if(pe){const hj=hoje(),m=tt.match(/dia (\d{1,2})/);if(/depois de amanha/.test(t))dv=new Date(hj.getFullYear(),hj.getMonth(),hj.getDate()+2);else if(m){dv=new Date(hj.getFullYear(),hj.getMonth(),+m[1]);if(dv<hj)dv=new Date(hj.getFullYear(),hj.getMonth()+1,+m[1])}else dv=new Date(hj.getFullYear(),hj.getMonth(),hj.getDate()+1)}
 if(ds>=valor(pl)){say('O desconto precisa ser menor que o valor do plano.');return}
 const v=r2(valor(pl)-ds);
 ask(`Renovar ${c.cliente.trim()} no ${pl.split(' - ')[0]} por ${brl(v)}${ds?` (desconto de ${brl(ds)})`:''}, início ${ini==-2?'anteontem':ini==-1?'ontem':'hoje'}${pe?`, pagamento pendente para ${dd(dv)}. Vai aparecer a tela do valor da dívida: toque em OK`:', pago hoje'}. Confirma?`,async()=>{
  const i=C.indexOf(c);ficha(i);$('#pl').value=pl;$('#ds').value=ds?String(ds).replace('.',','):'';$('#pe').checked=pe;$('#dvw').hidden=!pe;const d0=new Date();d0.setDate(d0.getDate()+ini);$('#di').value=iso(d0);if(pe)$('#dv').value=iso(dv);
  const m=await withAlert(()=>renovar(i));return m.length?m.join(' '):'Renovação feita.'})}
function acGasto(t){const tt=w2n(t),v=valOf(tt);if(!(v>0))return false;
 if(!/\b(lanca|lancar|lance|lancamento|gastei|gasto|registra|registrar|registre|anota|anotar|anote|inclui|incluir|inclua|adiciona|adicionar|adicione|paguei|comprei|coloca|colocar)\b/.test(t))return false;
 const DROP=new Set('lanca lancar lance lancamento gastei gasto gastos registra registrar registre anota anotar anote inclui incluir inclua adiciona adicionar adicione paguei comprei coloca colocar variavel variaveis reais real centavos centavo conto contos pila pilas empresa pessoal fixo fixos lista de do da dos das em no na nos nas com um uma para pra por favor e a o os as meu minha ao aos que foi'.split(' '));
 const sc=/\bempresa\b/.test(t)?'E':/\bpessoal\b/.test(t)?'P':(S.lastSc||'P');
 const fim=nome=>{const nm=['Mercado','Cigarro','Combustível',...(S.fixos||[]).filter(f=>f.var).map(f=>f.nome)],k=nz(nome),f=nm.find(x=>nz(x)===k)||nm.find(x=>k.length>=5&&lev(nz(x),k)<=1);
  nome=f||nome.replace(/\b\w/g,c=>c.toUpperCase());const fx=(S.fixos||[]).find(x=>x.var&&nz(x.nome)===nz(nome));const esc2=fx?(fx.sc||'P'):sc;
  ask(`Lançar ${brl(v)} em ${nome}, ${SCN[esc2].toLowerCase()}${fx?', na lista de gastos fixos':''}. Confirma?`,async()=>{const w=addVarEntry(nome,v,!!fx,esc2);await save();return w||`Lançado ${brl(v)} em ${nome}, ${SCN[esc2].toLowerCase()}.`})};
 const nome=tt.split(' ').filter(w=>w&&!/^[\d.]+$/.test(w)&&!DROP.has(w)).join(' ');
 if(!nome){btns=[['❌ Cancelar',cancelar]];ans=async T=>{const n=T[0].split(' ').filter(w=>w&&!DROP.has(w)).join(' ');if(!n)return false;ans=null;btns=[];fim(n);return true};say(`Lançar ${brl(v)} em qual gasto? Diga o nome, por exemplo mercado.`,listen);return true}
 fim(nome);return true}
async function acFecha(){window.FDL=null;await fechaDia();if(!window.FDL){say('Ainda há ações na fila sendo enviadas. Tente de novo em instantes.');return}const L=(window.FDL||[]).filter((r,i)=>$('#fd'+i)&&$('#fd'+i).checked).map(r=>r.c),nf=S.nf||[],tot=r2(nf.reduce((a,n)=>a+(num(n.valor)||vp(n.plano)),0));
 const msg=`Fechar o dia: ${L.length?L.length+' cliente'+(L.length>1?'s serão pausados ('+nomes(L)+')':' será pausado ('+nomes(L)+')'):'ninguém será pausado'}, ${nf.length} nota${nf.length==1?'':'s'} de ${brl(tot)} ${nf.length==1?'vai':'vão'} para a planilha e o relatório abre no WhatsApp. Confirma?`;
 ask(msg,async()=>{const m=await withAlert(()=>fdGo());return m.length?m.join(' '):'Fechamento feito. O relatório foi aberto no WhatsApp.'})}

/* ---------- roteador ---------- */
async function route(t){
 if(/\b(ajuda|comandos|o que (voce )?(sabe|faz|pode)|o que posso)\b/.test(t)){say(AJUDA);return true}
 if(/mais (rapido|depressa)|acelera/.test(t)){RT=Math.min(2,r2(RT+0.2));try{localStorage.setItem('kfl_vzr',RT)}catch(e){}say('Pronto, mais rápido.');return true}
 if(/mais (devagar|lento)|desacelera/.test(t)){RT=Math.max(0.8,r2(RT-0.2));try{localStorage.setItem('kfl_vzr',RT)}catch(e){}say('Pronto, mais devagar.');return true}
 if(/\b(repete|repita|fala de novo)\b/.test(t)&&lastSay){say(lastSay);return true}
 if(/\b(cancela|cancelar|esquece|silencio|cala a boca)\b/.test(t)){stopAll();say('Ok.');return true}
 if(/\b(abrir|abre|abra|mostrar|mostra|mostre|ir para|va para|vai para|tela)\b/.test(t))for(const [rx,lb,fn] of NAV)if(rx.test(t)){fn();say('Abri '+lb+'.');return true}
 const cue=/\b(quant[oa]s?|quais|qual|quem|como|existe|tem|ha|lista|listar|me diz|diga|fala|resumo|resume|total|saldo|valor)\b/.test(t),act=/\b(baixa|pagou|quitou|quitar|pausa|pausar|pause|renova|renovar|renove|whats|whatsapp|zap|zapzap|atualiz|fechar|fecha|buscar|busca|procurar|procura|pesquisar|pesquisa|lancar|lanca|lance|registrar|registra|anotar|anota|incluir|inclui|adicionar|adiciona|abrir|abre|abra|ficha)\b/.test(t);
 if(!act||cue){let r=null;st='exec';draw();try{r=await consulta(t)}catch(e){r='Não consegui consultar: '+(e&&e.message||e)}st='idle';if(r){say(r);return true}}
 if(/fech(ar|a|e|amento).*dia|fechamento/.test(t)){await acFecha();return true}
 if(/\batualiz/.test(t)){refrescar();say('Atualizando a lista de clientes.');return true}
 let m=t.match(/\b(?:buscar|busca|procurar|procura|pesquisar|pesquisa)\s+(.+)/);if(m){const q=m[1].replace(/\bcliente\b/g,'').trim();$('#q').value=q;tela('v1');lista();say(`Mostrando clientes com ${q}.`);return true}
 if(/\b(baixa|pagou|quitou|quitar)\b/.test(t))return acBaixa(t);
 if(/\b(pausa|pausar|pause)\b/.test(t))return acPausar(t);
 if(/\b(renova|renovar|renove|renovou)\b/.test(t))return needCli(t,C,c=>acRenovar(t,c),'Não achei esse cliente. Diga o nome e os números.');
 if(/\b(whats|whatsapp|zap|zapzap)\b/.test(t))return needCli(t,C,async c=>{const i=C.indexOf(c),k=/\bpessoal\b/.test(t)||!String(c.celcon||'').replace(/\D/g,'')?'cel':'celcon';const mm=await withAlert(async()=>wa(i,k));say(mm.length?mm.join(' '):`Abri o WhatsApp ${k=='cel'?'pessoal':'comercial'} de ${c.cliente.trim()}. Escolha notificar ou confirmar na tela.`)},'Não achei esse cliente. Diga o nome e os números.');
 if(acGasto(t))return true;
 const cli=/\b(cliente|ficha)\b/.test(t)||/(situacao|quando vence|vencimento|informac|dados|como esta|esta pendente|esta ativo|qual o plano)/.test(t);
 if(cli){const r=achaCli(t,C);if(r.length)return needCli(t,C,c=>{if(/\b(cliente|ficha|abrir|abre|mostrar|mostra|ver)\b/.test(t)){ficha(C.indexOf(c))}say(info(c))})}
 for(const [rx,lb,fn] of NAV)if(rx.test(t)){fn();say('Abri '+lb+'.');return true}
 const r=achaCli(t,C);if(r.length&&r[0].s>=3)return needCli(t,C,c=>{ficha(C.indexOf(c));say('Abri a ficha. '+info(c))});
 return false}
const FIM=/^((nao|nada|so isso|e so isso|e isso|isso mesmo|chega|obrigad[oa]|valeu|tchau|ja deu|ja chega|ta bom|esta bom|tudo certo|ok)( (obrigad[oa]|mais|nada|valeu|e isso|por hoje|pode parar))?|(pode )?(parar|encerrar?|desligar?|desliga o microfone)|nao (preciso|quero|tem mais|obrigad[oa]))$/,SIM=/^(sim|quero|tenho|pode|claro|uhum|aham)( |$)/;
async function handle(alts){const F=lastF;lastF=false;const T=alts.map(nz).filter(Boolean);if(!T.length){say('Não entendi. Diga ajuda para ver o que posso fazer.');return}
 if(F&&!ans&&T.some(t=>FIM.test(t)||(t.split(' ').length<=6&&/\b(nao|nada)\b/.test(t)&&!/\d/.test(t)))){sess=false;say(pick(TCHAU),()=>{st='idle';heard='';reply='';draw();P.hidden=true});return}
 if(F&&!ans&&T.every(t=>t.split(' ').length<=2&&SIM.test(t))){say(pick(FALE),()=>listen(1));return}
 if(ans){const f=ans,r=await f(T);if(r)return;ans=null;btns=[]}
 fail='';for(const t of T)if(await route(t))return;
 say(fail||`Não entendi “${alts[0]}”. Diga ajuda para ver os comandos.`)}

B.onclick=()=>{if(st=='ouvindo'){stopAll();draw();return}listen()};
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopAll()});
window.vozTeste=handle;
window.vozInicio=()=>{if(!SR||document.hidden||window.__noAuto)return;const h=new Date().getHours(),sd=h<12?'Bom dia':h<18?'Boa tarde':'Boa noite';auto0.v=true;
 say(pick([sd+'! Do que você precisa?','Olá! Como posso ajudar?',sd+'! Em que posso ajudar?','Oi! O que você precisa agora?','Bem-vindo de volta! Do que você precisa?','Oi, tudo bem? Pode falar, o que você precisa?']),()=>listen(1))};
{let n=0;const iv=setInterval(()=>{n++;let pronto=false;try{pronto=typeof SO!=='undefined'&&SO&&cur==='v1'&&C.length>0}catch(e){}if(pronto){clearInterval(iv);window.vozInicio()}else if(n>60)clearInterval(iv)},500)}
})();
